apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureflow-api
  namespace: secureflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureflow-api
  template:
    metadata:
      labels:
        app: secureflow-api
    spec:
      containers:
        - name: secureflow-api
          image: secureflow-api:1.2
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"