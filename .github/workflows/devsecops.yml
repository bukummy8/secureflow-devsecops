name: SecureFlow DevSecOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run tests
        working-directory: app
        run: npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: security/semgrep.yml

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secureflow-api:${{ github.sha }} .

  kubernetes:
    name: Validate Kubernetes
    runs-on: ubuntu-latest
    needs:
      - test
      - security
      - docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client \
            -f kubernetes/namespace.yaml

          kubectl apply --dry-run=client \
            -f kubernetes/deployment.yaml

          kubectl apply --dry-run=client \
            -f kubernetes/service.yaml